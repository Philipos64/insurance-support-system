services:
  db:
    container_name: Insurance_DB
    image: pgvector/pgvector:pg17   # Postgres 17 with pgvector
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ABC
      POSTGRES_DB: testdb_new_v1
    ports:
      # Bound to 127.0.0.1 so the database is only reachable from this
      # machine. Without the prefix Docker binds 0.0.0.0, which puts
      # Postgres on whatever network you happen to be on.
      - "127.0.0.1:5433:5432"
    volumes:
      - ./pgdata_test:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

# Connection string:
#   postgresql://root:ABC@localhost:5433/testdb_new_v1
#
# The password here is a throwaway for a local container holding generated
# data. It matches .env.example on purpose. If you ever run this anywhere
# other than your own machine, change both and don't commit the new one.
#
#   docker compose up -d     start
#   docker compose down -v   stop and delete the data
