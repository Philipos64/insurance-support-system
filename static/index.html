<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Support System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-text">
      <h1>Insurance Support</h1>
      <p>plan-and-execute workflow</p>
    </div>
  </div>

  <div class="view-switch" role="group" aria-label="View mode">
    <button type="button" class="view-btn is-active" data-view="customer">Customer</button>
    <button type="button" class="view-btn" data-view="developer">Developer</button>
  </div>
</header>

<main class="layout" data-view="customer">

  <!-- ============ INSPECT (takes over the chat column) ============ -->
  <section class="panel inspect-panel" id="inspect" hidden>
    <div class="panel-head">
      <h2>Step detail</h2>
      <button type="button" id="inspect-close" class="ghost-btn">Back to conversation</button>
    </div>
    <div id="inspect-body" class="inspect-body"></div>
  </section>

  <!-- ============ CHAT ============ -->
  <section class="panel chat-panel">
    <div class="panel-head">
      <h2>Conversation</h2>
      <div class="head-actions">
        <button type="button" id="toggle-examples" class="ghost-btn" aria-expanded="false">Examples</button>
        <button type="button" id="reset" class="ghost-btn">Clear</button>
      </div>
    </div>

    <div id="messages" class="messages" aria-live="polite"></div>

    <div id="status" class="status" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">Working…</span>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <input id="input" type="text" placeholder="Ask about a policy, bill, or claim…" required>
      <button type="submit" id="send">Send</button>
    </form>

    <div id="library" class="library" hidden>
      <div id="library-tabs" class="library-tabs" role="tablist"></div>
      <p id="library-blurb" class="library-blurb"></p>
      <div id="library-list" class="library-list"></div>
    </div>
  </section>

  <!-- ============ TRACE ============ -->
  <section class="panel trace-panel">
    <div class="panel-head">
      <h2>Execution trace</h2>
      <div class="head-actions">
        <label class="raw-toggle">
          <input type="checkbox" id="show-graph" checked>
          <span>Graph</span>
        </label>
        <label class="raw-toggle">
          <input type="checkbox" id="show-raw">
          <span>Raw state</span>
        </label>
      </div>
    </div>

    <div id="graph" class="graph" aria-label="Workflow graph"></div>

    <div id="trace" class="trace">
      <div class="empty">
        <p class="empty-title">No execution yet</p>
        <p class="empty-body">Send a message to watch the graph run. Each node appears here as it
        executes, with the plan it produced, the task it received, and what it returned.</p>
      </div>
    </div>
  </section>

</main>

<script src="/static/graph.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
